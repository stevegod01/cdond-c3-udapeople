name: Learning lab checks
on:
  push:
    branches: [master]
    paths: ['labs/**', '.github/workflows/lab-quality.yml']
  pull_request:
    paths: ['labs/**', '.github/workflows/lab-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s labs/lambda-packaging/tests -v
      - run: cd labs/lambda-packaging/function && zip ../../../lambda-example.zip lambda_function.py
      - run: docker compose -f labs/docker-compose/docker-compose.yml config --quiet
        env:
          DJANGO_SECRET_KEY: ci-placeholder-never-used-for-a-running-service
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-example
          path: lambda-example.zip
          retention-days: 7
