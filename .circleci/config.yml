version: 2.1
commands:
  destroy-environment:
    description: Destroy back-end and front-end cloudformation stacks given a workflow ID.
    parameters:
      workflow_id:
        type: string
    steps:
    - run:
        name: Destroy environments
        when: on_fail
        command: |
          echo "Destroying environment: << parameters.workflow_id >> "
          aws s3 rm s3://udapeople-<<parameters.workflow_id>> --recursive
          aws cloudformation delete-stack --stack-name udapeople-backend-<<parameters.workflow_id>>
          aws cloudformation delete-stack --stack-name udapeople-frontend-<<parameters.workflow_id>>
jobs:
  build-frontend:
    docker:
    - image: node:24.16.0
    steps:
    - checkout
    - run:
        name: Build front-end
        command: |
          cd frontend
          npm ci --ignore-scripts --legacy-peer-deps
          npm run build
    environment:
      NODE_OPTIONS: --openssl-legacy-provider
  build-backend:
    docker:
    - image: node:24.16.0
    steps:
    - checkout
    - run:
        name: Back-end build
        command: |
          cd backend
          npm ci --ignore-scripts --legacy-peer-deps
          npm run build
  test-frontend:
    docker:
    - image: node:24.16.0
    steps:
    - checkout
    - run:
        name: Run frontend test
        command: |
          cd frontend
          npm ci --ignore-scripts --legacy-peer-deps
          npm run test
    environment:
      NODE_OPTIONS: --openssl-legacy-provider
  test-backend:
    docker:
    - image: node:24.16.0
    steps:
    - checkout
    - run:
        name: Run backend tests
        command: |
          cd backend
          npm ci --ignore-scripts --legacy-peer-deps
          npm run test
  scan-frontend:
    docker:
    - image: node:24.16.0
    steps:
    - checkout
    - run:
        name: Scan Frontend
        command: |
          cd frontend
          npm ci --ignore-scripts --legacy-peer-deps
          npm audit --audit-level=critical
    environment:
      NODE_OPTIONS: --openssl-legacy-provider
  scan-backend:
    docker:
    - image: node:24.16.0
    steps:
    - checkout
    - run:
        name: Scan Backend
        command: |
          cd backend
          npm ci --ignore-scripts --legacy-peer-deps
          npm audit --audit-level=critical
  deploy-infrastructure:
    docker:
    - image: amazon/aws-cli
    steps:
    - checkout
    - run: yum install tar gzip -y
    - run:
        name: Ensure back-end infrastructure exists
        command: |
          : "${BACKEND_AMI_ID:?Set a current Ubuntu x86_64 AMI for AWS_DEFAULT_REGION}"
          : "${EC2_KEY_PAIR_NAME:?Set the EC2 key pair installed in CircleCI}"
          : "${SSH_CIDR:?Set the CIDR allowed to connect over SSH}"
          aws cloudformation deploy \
            --template-file .circleci/files/backend.yml \
            --tags project=udapeople \
            --stack-name "udapeople-backend-${CIRCLE_WORKFLOW_ID:0:7}" \
            --parameter-overrides ID="${CIRCLE_WORKFLOW_ID:0:7}" ImageId="$BACKEND_AMI_ID" KeyPairName="$EC2_KEY_PAIR_NAME" SshCidr="$SSH_CIDR"
    - run:
        name: Ensure front-end infrastructure exist
        command: |
          aws cloudformation deploy \
            --template-file .circleci/files/frontend.yml \
            --tags project=udapeople \
            --stack-name "udapeople-frontend-${CIRCLE_WORKFLOW_ID:0:7}" \
            --parameter-overrides ID="${CIRCLE_WORKFLOW_ID:0:7}"
    - run:
        name: Add back-end ip to ansible inventory
        command: |
          aws ec2 describe-instances \
          --query "Reservations[*].Instances[*].[PublicIpAddress]" \
          --filters "Name=tag:Name,Values=backend-${CIRCLE_WORKFLOW_ID:0:7}" \
          --output text >> ~/project/.circleci/ansible/inventory.txt
          cat ~/project/.circleci/ansible/inventory.txt
    - persist_to_workspace:
        root: ~/
        paths:
        - project/.circleci/ansible/inventory.txt
    - destroy-environment:
        workflow_id: ${CIRCLE_WORKFLOW_ID:0:7}
  configure-infrastructure:
    docker:
    - image: python:3.12-alpine
    steps:
    - checkout
    - add_ssh_keys:
        fingerprints:
        - 4b:b9:ae:3c:bf:6b:8d:29:f0:7a:c4:03:3c:35:fd:1e
    - attach_workspace:
        at: ~/
    - run:
        name: Install dependencies
        command: |
          apk add --update --no-cache ansible tar gzip aws-cli openssh

          ansible-galaxy collection install -r .circleci/ansible/requirements.yml
    - run:
        name: Configure server
        command: |
          pwd
          cd .circleci/ansible
          ls -al
          ansible-playbook -i inventory.txt configure-server.yml
        no_output_timeout: 30m
    - destroy-environment:
        workflow_id: ${CIRCLE_WORKFLOW_ID:0:7}
  run-migrations:
    docker:
    - image: node:24.16.0
    steps:
    - checkout
    - run:
        name: Run migrations
        command: |
          cd backend
          npm ci --ignore-scripts --legacy-peer-deps
          npm run migrations > migrations_dump.txt
          mkdir -p /tmp/migration-state
          printf '0' > /tmp/migration-state/applied
          if grep -q 'has been executed successfully' migrations_dump.txt; then printf '1' > /tmp/migration-state/applied; fi
    - persist_to_workspace:
        root: /tmp/migration-state
        paths:
        - .
  deploy-frontend:
    docker:
    - image: python:3.12-alpine
    steps:
    - checkout
    - attach_workspace:
        at: /tmp/migration-state
    - attach_workspace:
        at: ~/
    - run:
        name: Install dependencies
        command: |
          apk add --update --no-cache tar
          apk add --update --no-cache gzip
          apk add --update --no-cache nodejs
          apk add --update --no-cache npm
          apk add --update --no-cache aws-cli
          apk add --update --no-cache curl

          apk add --update --no-cache python3
    - run:
        name: Get backend url
        command: |
          export BACKEND_IP=$(aws ec2 describe-instances \
          --query "Reservations[*].Instances[*].[PublicIpAddress]" \
          --filters "Name=tag:Name,Values=backend-${CIRCLE_WORKFLOW_ID:0:7}" \
          --output text)
          export API_URL="http://${BACKEND_IP}:3030"
          echo "API_URL=${API_URL}"
          echo API_URL="http://${BACKEND_IP}:3030" >> frontend/.env
          cat frontend/.env
    - run:
        name: Deploy frontend objects
        command: |
          cd frontend
          npm ci --ignore-scripts --legacy-peer-deps
          npm run build
          tar -czvf artifact-"${CIRCLE_WORKFLOW_ID:0:7}".tar.gz dist
          aws s3 cp dist s3://udapeople-${CIRCLE_WORKFLOW_ID:0:7} --recursive
    - destroy-environment:
        workflow_id: ${CIRCLE_WORKFLOW_ID:0:7}
    environment:
      NODE_OPTIONS: --openssl-legacy-provider
  deploy-backend:
    docker:
    - image: python:3.12-alpine
    steps:
    - checkout
    - attach_workspace:
        at: /tmp/migration-state
    - add_ssh_keys:
        fingerprints:
        - 4b:b9:ae:3c:bf:6b:8d:29:f0:7a:c4:03:3c:35:fd:1e
    - attach_workspace:
        at: ~/
    - run:
        name: Install dependencies
        command: |
          apk add --update --no-cache ansible tar gzip nodejs npm curl aws-cli

          apk add --update --no-cache python3

          ansible-galaxy collection install -r .circleci/ansible/requirements.yml
    - run:
        name: Deploy backend
        command: |
          pwd
          cd backend
          touch .env
          echo ENVIRONMENT=production > ".env"
          echo TYPEORM_CONNECTION=postgres >> ".env"
          echo TYPEORM_ENTITIES=./src/modules/domain/**/*.entity.ts >> ".env"
          echo TYPEORM_MIGRATIONS=./src/migrations/*.ts >> ".env"
          echo TYPEORM_MIGRATIONS_DIR=./src/migrations >> ".env"
          echo NODE_ENV=production >> ".env"
          echo TYPEORM_HOST=$TYPEORM_HOST >> ".env"
          echo TYPEORM_PORT=$TYPEORM_PORT >> ".env"
          echo TYPEORM_USERNAME=$TYPEORM_USERNAME >> ".env"
          echo TYPEORM_PASSWORD=$TYPEORM_PASSWORD >> ".env"
          echo TYPEORM_DATABASE=$TYPEORM_DATABASE >> ".env"

          pwd
          ls -al
          npm ci --ignore-scripts --legacy-peer-deps
          npm run build
          cd ..
          pwd
          ls -al
          # Zip the directory
          tar --exclude=node_modules --exclude=.git -C backend -czvf artifact.tar.gz .
          cd .circleci/ansible
          echo "Contents  of the inventory.txt file is -------"
          cat inventory.txt
          ansible-playbook -i inventory.txt deploy-backend.yml
    - destroy-environment:
        workflow_id: ${CIRCLE_WORKFLOW_ID:0:7}
  smoke-test:
    docker:
    - image: python:3.12-alpine
    steps:
    - checkout
    - attach_workspace:
        at: /tmp/migration-state
    - run:
        name: Install dependencies
        command: |
          apk add --update --no-cache tar gzip nodejs npm curl aws-cli

          apk add --update --no-cache python3
    - run:
        name: Get backend url and Backend smoke test.
        command: |
          export BACKEND_IP=$(aws ec2 describe-instances \
          --query "Reservations[*].Instances[*].[PublicIpAddress]" \
          --filters "Name=tag:Name,Values=backend-${CIRCLE_WORKFLOW_ID:0:7}" \
          --output text)
          echo ${BACKEND_IP}

          export BACKEND=$(echo $BACKEND_IP | grep -o '[^ ]*$')

          echo $BACKEND
          export API_URL="http://${BACKEND}:3030"
          echo "API_URL=${API_URL}"
          python3 scripts/smoke_test.py backend "${API_URL}/api/status"
    - run:
        name: Frontend smoke test.
        command: |
          URL="http://udapeople-${CIRCLE_WORKFLOW_ID:0:7}.s3-website.${AWS_DEFAULT_REGION}.amazonaws.com"
          python3 scripts/smoke_test.py frontend "$URL"
    - destroy-environment:
        workflow_id: ${CIRCLE_WORKFLOW_ID:0:7}
  cloudfront-update:
    docker:
    - image: amazon/aws-cli
    steps:
    - checkout
    - run:
        name: Install dependencies
        command: |
          yum install tar gzip -y
    - run:
        name: Get old stack workflow id
        command: |
          OLD=$(aws cloudformation list-exports --query 'Exports[?Name==`WorkflowID`].Value' --output text)
          case "$OLD" in
            None|"") OLD_ID=none ;;
            udapeople-*) OLD_ID="${OLD#udapeople-}" ;;
            *) echo "Unrecognized old workflow identity; refusing deployment." >&2; exit 1 ;;
          esac
          if [ "$OLD_ID" != none ] && ! printf "%s" "$OLD_ID" | grep -Eq "^[0-9a-f]{7}$"; then exit 1; fi
          printf "%s" "$OLD_ID" > ~/project/OldWorkflowID.txt
    - persist_to_workspace:
        root: ~/
        paths:
        - project/OldWorkflowID.txt
    - run:
        name: Update cloudfront distribution
        command: |
          aws cloudformation deploy --template-file .circleci/files/cloudfront.yml --stack-name InitialStack --parameter-overrides WorkflowID="udapeople-${CIRCLE_WORKFLOW_ID:0:7}" --tags project=udapeople
  cleanup:
    docker:
    - image: amazon/aws-cli
    steps:
    - checkout
    - attach_workspace:
        at: ~/
    - run:
        name: Remove validated previous environment
        command: |
          OLD_ID=$(cat ~/project/OldWorkflowID.txt)
          CURRENT_ID="${CIRCLE_WORKFLOW_ID:0:7}"
          if [ "$OLD_ID" = none ] || [ "$OLD_ID" = "$CURRENT_ID" ]; then exit 0; fi
          if ! printf "%s" "$OLD_ID" | grep -Eq "^[0-9a-f]{7}$"; then echo "Refusing invalid cleanup identifier" >&2; exit 1; fi
          aws s3 rm "s3://udapeople-$OLD_ID" --recursive
          aws cloudformation delete-stack --stack-name "udapeople-backend-$OLD_ID"
          aws cloudformation delete-stack --stack-name "udapeople-frontend-$OLD_ID"
  offline-checks:
    docker:
    - image: python:3.12-slim
    steps:
    - checkout
    - run: python -m pip install -r requirements-checks.txt
    - run: python scripts/validate_config.py
    - run: python -m unittest discover -s tests -v
  application-checks:
    docker:
    - image: node:24.16.0
    environment:
      CI: 'true'
      NODE_OPTIONS: --openssl-legacy-provider
      API_URL: http://127.0.0.1:3030
    steps:
    - checkout
    - run:
        name: Backend build and unit tests
        command: |
          cd backend
          npm ci --ignore-scripts --legacy-peer-deps
          npm run build
          npm test -- --runInBand --coverage=false
    - run:
        name: Frontend build and unit tests
        command: |
          cd frontend
          npm ci --ignore-scripts --legacy-peer-deps
          npm run build
          npm test -- --runInBand --coverage=false
workflows:
  validate:
    jobs:
    - offline-checks
    - application-checks
  deploy:
    jobs:
    - build-frontend
    - build-backend
    - test-frontend:
        requires:
        - build-frontend
    - test-backend:
        requires:
        - build-backend
    - scan-backend:
        requires:
        - build-backend
    - scan-frontend:
        requires:
        - build-frontend
    - approve-deployment:
        type: approval
        requires:
        - test-frontend
        - test-backend
        - scan-frontend
        - scan-backend
    - deploy-infrastructure:
        requires:
        - approve-deployment
        filters:
          branches:
            only:
            - master
    - configure-infrastructure:
        requires:
        - deploy-infrastructure
    - run-migrations:
        requires:
        - configure-infrastructure
    - deploy-frontend:
        requires:
        - run-migrations
    - deploy-backend:
        requires:
        - run-migrations
    - smoke-test:
        requires:
        - deploy-backend
        - deploy-frontend
    - cloudfront-update:
        requires:
        - smoke-test
    - cleanup:
        requires:
        - cloudfront-update
    when: << pipeline.parameters.deploy >>
parameters:
  deploy:
    type: boolean
    default: false
