---
- name: Create the scoped application directory
  ansible.builtin.file:
    path: /home/ubuntu/udapeople
    state: directory
    mode: '0755'

- name: Copy and unpack the pipeline artifact
  ansible.builtin.unarchive:
    src: ~/project/artifact.tar.gz
    dest: /home/ubuntu/udapeople

- name: Install locked runtime dependencies
  ansible.builtin.command:
    cmd: npm ci --omit=dev --ignore-scripts --legacy-peer-deps
    chdir: /home/ubuntu/udapeople
  environment:
    PATH: "/usr/local/bin:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"

- name: Restart only the Udapeople process
  ansible.builtin.shell: |
    if pm2 describe udapeople >/dev/null 2>&1; then
      pm2 restart udapeople --update-env
    else
      pm2 start dist/main.js --name udapeople
    fi
    pm2 save
  args:
    chdir: /home/ubuntu/udapeople
    executable: /bin/bash
  environment:
    PATH: "/usr/local/bin:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"
