name: Validate and package Lambda example
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q function
      - run: cd function && zip ../lambda-example.zip lambda_function.py
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-example
          path: lambda-example.zip
          retention-days: 7
